{# Table-based layout for email-client compatibility — see plans/06-email.md §7.
   No flexbox, no grid, no <style> block, no classes: Gmail strips <head> styles
   and discards CSS layout properties, so everything here is inline. #}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ store_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5ead8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5ead8;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#fdf8ef;">

<tr><td style="padding:28px 32px 20px 32px;border-bottom:1px solid #e6cf9a;">
  <span style="font-family:Georgia,serif;font-size:22px;letter-spacing:6px;color:#2e2b25;">{{ store_name|upper }}</span>
</td></tr>

<tr><td style="padding:28px 32px;">
{% block content %}{% endblock %}
</td></tr>

<tr><td style="padding:20px 32px;background-color:#2d3a2b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td style="font-family:Georgia,serif;font-size:13px;color:#e6cf9a;">
      {{ store_name }} &middot; <a href="{{ instagram_url }}" style="color:#e6cf9a;">Instagram</a>
    </td>
    <td align="right" style="font-family:Georgia,serif;font-size:13px;color:#e6cf9a;">
      <a href="https://wa.me/{{ whatsapp_number }}" style="color:#e6cf9a;">WhatsApp</a>
    </td>
  </tr>
  </table>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
